<style>
    :root{
  /* --primary-color: #d1d1c5;
  --secondary-color: #83836f; */
  --primary-color: #f9f9f9;
  --secondary-color: #4d6837;

}
.dark-theme{
  --primary-color: #121212;

}
body.dark-theme {
 color: #888 !important;
}
    *{
        font-weight: 400;

    }
    #calendar{
        margin-inline-start: 87px !important;

    }
    .fc-scrollgrid-liquid{
        border-radius: 10px;

    .fc-toolbar-chunk{
        margin-right: 15px !important;

    .popover {
  position: absolute;
  background-color: #ffffff;      /* crisp white background */
  border-radius: 16px;           /* soft rounded corners */
  box-shadow: 0 10px 25px rgba(0, 0, 0, 0.25); /* deeper shadow for depth */
  padding: 20px 18px;
  width: 300px;
  z-index: 5000;
  display: none;
  font-family: "Roboto", sans-serif;
  font-size: 14px;
  color: #202124;                 /* dark text for readability */
  border-left: 5px solid #92ae7b; /* colorful accent bar like Google Calendar */
}

.popover h2 {
  font-weight: 600;
  font-size: 24px;
  text-decoration: wavy;
  margin: 0 0 12px 0;
  color: #678e47; 
}
.fc-event-title-container{
  background-color: #b6c7a9;
}
.popover button#closePopover {
  position: absolute;
  top: 12px;
  right: 12px;
  border: none;
  background: transparent;
  font-size: 20px;
  color: #5f6368;
  cursor: pointer;
  transition: color 0.2s;
}

.popover button#closePopover:hover {
  color: #202124;
}

.popover div p {
  margin: 6px 0;
  line-height: 1.5;
}

.popover div p strong {
  color: #3c4043;  /* labels darker */
}

.popover div p span {
  color: #202124;  /* data text bold */
  font-weight: 500;
}

/* Optional: subtle hover highlight for popover */
.popover:hover {
  transform: translateY(-2px);
  transition: transform 0.2s;
}
.fc-toolbar-chunk .fc-button-group button{
  background-color: #71865f;
}
.fc-toolbar-chunk .fc-button-group button:hover{
  background-color: var(--secondary-color);
}
.fc-toolbar-chunk .fc-button-group button.selected{
  background-color: var(--secondary-color);
}
.fc-daygrid-event-harness > *{
  background-color: transparent;
  border: none;
}
.fc-daygrid-day-frame {
  width: 95px;
  font-size: 14px;
}
.fc-list-event-graphic{

}
.fc-event-main{

}
.fc-event-main:hover{
  /* background-color: rgb(234, 234, 234); */
  background-color: #6e7f5f86;
  /* color: red; */
  border-radius: 20px;
  transition: all 0.3s;
}
</style>

<script>

document.addEventListener('DOMContentLoaded', async function() {
  const { data: { user }, error: authError } = await supa.auth.getUser();

          // adding tasks to the calendar
 // first get all farms of this user
const { data: farms } = await supa
  .from('Farms')
  .select('User_id')
  .eq('User_id', user.id);

const farmIds = farms.map(f => f.id);
const { data: tasks } = await supa
    .from('tasks')
    .select(`due_date,
              priority,status,description,
              farm:Farms(Farm_name, User_id),
              assignee: users(Username),
              structure:FarmStructures(structure_name)
      `)
       .in('farm_id', farmIds);

      console.log("user", user.id);

      console.log(tasks);
  const events = tasks?.map(task => ({
    title: task.description,
    start: task.due_date,
    end: task.due_date,
    allDay: true,
    extendedProps: {
      type: 'task',
      status: task.status,
      farm: task.farm.Farm_name,
      structure: task.structure.structure_name,
      assignee: task.assignee.Username
    }
  })) || [];
  console.log(tasks)
        var calendarEl = document.getElementById('calendar');
        var calendar = new FullCalendar.Calendar(calendarEl, {
            timeZone: 'GST',
            themeSystem: 'bootstrap5',
            // height: 'auto',           // let it grow with content
            contentHeight: 700,    
            headerToolbar: {
                left: 'prev,next today',
                center: 'title',
                right: 'dayGridMonth,timeGridWeek,timeGridDay,listMonth'
            },
            // weekNumbers: true,
            dayMaxEvents: true, 
            events: events,
            eventContent: function(arg){
              let ul = document.createElement('ul');
              let li = document.createElement('li');
              li.textContent = arg.event.title;

              li.style.marginInlineStart = '15px';
              li.style.fontSize = '15px';
              li.style.color = '#678e47';
              li.style.listStyleType = 'disc'; 
              li.style.background = 'transparent';
              li.style.padding = '0'; 

              ul.appendChild(li);
              return { domNodes: [ul] };
            },
            eventClick: function(info) {
              // console.log('hh, ', info);
              const popover = document.getElementById('eventPopover');
              document.getElementById('modalTitle').textContent = info.event.title;
              // document.getElementById('modalEnd').textContent = info.event.end || 'N/A';
              document.getElementById('modalStatus').textContent = info.event.extendedProps.status || 'N/A';
              document.getElementById('modalAssignee').textContent = info.event.extendedProps.assignee || 'N/A';
              const farm = info.event.extendedProps.farm || 'N/A';
              const structure = info.event.extendedProps.structure ? `, ${info.event.extendedProps.structure}` : '';
              document.getElementById('modalFarm').textContent = farm + structure;
               //  these 2 lines so that the browser calculate actual size, to avoid misplacing the popover when it goes offwidth, without showing it
               popover.style.visibility = "hidden";
               popover.style.display = "block";
              const rect = info.el.getBoundingClientRect();
              const popoverWidth = popover.offsetWidth;
              const popoverHeight = popover.offsetHeight;
              let left = rect.right + 10;
              let top = rect.top + window.scrollY;

              // Checking if it goes beyond viewport width
              if (left + popoverWidth > window.innerWidth) {
                // show on the left
                left = rect.left - popoverWidth - 10;
              }

              if (top + popoverHeight > window.scrollY + window.innerHeight) {
                top = window.scrollY + window.innerHeight - popoverHeight - 10;
              }

              popover.style.top = top + "px";
              popover.style.left = left + "px";
              popover.style.visibility = "visible";
              popover.style.display = "block";              
            }
            
        });
        calendar.render();
        document.getElementById('closePopover').addEventListener('click', function () {
            document.getElementById('eventPopover').style.display = 'none'; 
});
        
  });
</script>

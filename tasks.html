function getCurrentLanguage() {

function filterTasks(filter, tasks){
  const today = new Date();
  console.log(tasks);

  tasks.forEach(task => {
    const dueDate = new Date(task.due_date);
    console.log(dueDate);

    let show = false;
    if (filter === getTranslation("allTasks")) { show = true; } 
    else if (filter === getTranslation("thisMonth")) {
      show = dueDate.getMonth() === today.getMonth() && 
             dueDate.getFullYear() === today.getFullYear();
    } 
    else if (filter === getTranslation("lastMonth")) {
      const lastMonth = new Date(today.getFullYear(), today.getMonth() - 1, 1);
      show = dueDate.getMonth() === lastMonth.getMonth() && 
             dueDate.getFullYear() === lastMonth.getFullYear();
    } 
    else if (filter === getTranslation("nextMonth")) {
      const nextMonth = new Date(today.getFullYear(), today.getMonth() + 1, 1);
      show = dueDate.getMonth() === nextMonth.getMonth() && 
             dueDate.getFullYear() === nextMonth.getFullYear();
    }
    task.style.display = show ? "table-row" : "none";
  });
}

function statusClass(status) {
  switch (status.toLowerCase()) { 
    case "delayed": return "delayed";
    case "cancelled": return "cancelled";
    case "not started": return "notStarted";
    case "completed": return "completed";
    case "in progress": return "inProgress";
    default: return "";
  }
}
function priorityClass(priority) { 
  switch (priority.toLowerCase()) { 
    case "low": return "low";
    case "medium": return "medium";
    case "high": return "high";
    case "urgent": return "urgent";
    default: return "";
  }
}


function formatDate(d) {
  if (!d) return "-";
  const date = new Date(d);
  return date.toLocaleDateString(undefined, { year: 'numeric', month: 'short', day: '2-digit' });
}

function searchTable() {
    table_rows.forEach((row, i) => {
      let table_data  = row.textContent.toLowerCase(),
      search_data = search.value.toLowerCase();

      row.classList.toggle('hide' , table_data.indexOf(search_data)<0); // a condition according to the search result, if not match HIDE
      row.style.setProperty('--delay', i/25 + 's'); //i is the row 
    })
  }

  table_headings.forEach((head, i) => {
    let sort_asc = true;
    head.onclick = () => {
      table_headings.forEach(head => head.classList.remove('active'));
      head.classList.add('active');

      document.querySelectorAll('td').forEach(td=> td.classList.remove('active'))
      const table_rows = document.querySelectorAll('tbody tr');
      table_rows.forEach(row => {
        row.querySelectorAll('td')[i].classList.add('active')
      })

      head.classList.toggle('asc', sort_asc)
      sort_asc= head.classList.contains('asc') ? false : true;

      sortTable(i, sort_asc);
    }
  })

 function sortTable(column, sort_asc) { // sort_asc: flag that determines whether to sort asc or desc
  const table_rows = document.querySelectorAll('tbody tr'); // Get the latest rows every time
  
  // mapping for priority column, sorting acc to priority not alphabetics
    const priorityOrder = {
      "urgent":4,
      "high": 3,
      "medium":2 ,
      "low": 1
    };
    
    [...table_rows].sort((a, b) => {
      // trim() is to remove any whitespaces from the beginning and end of a string 
      // we extract the priority text of a cell, look up its value in the mapping 
      let first_row = a.querySelectorAll('td')[column].textContent.trim().toLowerCase(),
          second_row = b.querySelectorAll('td')[column].textContent.trim().toLowerCase();

      if (column==3){
        let first_priority=0, second_priority=0;
        // first_p, second_p are the <p> elements for the 2 rows (priority cells) being compared
        const first_p = a.querySelectorAll('td')[column].querySelector('p');
        const second_p = b.querySelectorAll('td')[column].querySelector('p');
        if (first_p) first_priority = priorityOrder[first_p.textContent.trim().toLowerCase()] || 0; // here looking up the priorityOrder mapping, to get the key value
        if (second_p) second_priority = priorityOrder[second_p.textContent.trim().toLowerCase()] || 0;
         // if sort_asc = true --> asc order, less urgent to more urgent, first_priority - second_priority, so get every pair subtracted, then sort them ascending 
          // If the result is negative, Row A comes before Row B.
          // If the result is positive, Row A comes after Row B.
          // If the result is zero, their order doesn't change.
          return sort_asc ? (first_priority - second_priority) : (second_priority - first_priority);
        }
        return sort_asc ? (first_row < second_row ? 1 : -1) : (first_row < second_row ? -1 : 1);
    })
        .map(sorted_row => document.querySelector('tbody').appendChild(sorted_row));
}
function exportTableToExcel(){
  const table = document.getElementById("workers_table");
  const workbook = XLSX.utils.table_to_book(table, {sheet: "Tasks"});

  const now= new Date();
  const dayName = now.toLocaleDateString('en-US', {weekday: 'long'});

  const year = now.getFullYear();
  const month = String(now.getMonth() + 1).padStart(2, '0');
  const date = String(now.getDate()).padStart(2, '0');
  const formattedDate = `${year}-${month}-${date}`;

  const fileName = `Tasks-${dayName}-${formattedDate}.xlsx`;
  XLSX.writeFile(workbook, fileName);
}

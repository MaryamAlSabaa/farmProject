  <script type="module">
    
    const countryElement = document.querySelector('.country-txt');
    // const API_KEY = '4a3c116d2fa56338e6aa52b83240c51a';

    async function fetchWeatherDataOmete(lat, lng) {
    // Construct the API URL
    const apiURL = `https://api.open-meteo.com/v1/forecast?latitude=${lat}&longitude=${lng}&hourly=temperature_2m,apparent_temperature,precipitation,relative_humidity_2m,soil_moisture_0_1cm,wind_speed_10m,uv_index,dewpoint_2m&daily=temperature_2m_max,temperature_2m_min&timezone=Asia/Dubai`;
    console.log("Fetching URL:", apiURL);

    try {
        const resp = await fetch(apiURL);
        if (!resp.ok) throw new Error(`HTTP error! status: ${resp.status}`);
        const data = await resp.json();
      console.log("heree");
        // Parse hourly data
        const hourly = {
            time: data.hourly.time.map(t => new Date(t)),
            temperature_2m: data.hourly.temperature_2m,
            apparent_temperature: data.hourly.apparent_temperature,
            precipitation: data.hourly.precipitation,
            humidity_2m: data.hourly.relative_humidity_2m,
            soil_moisture_0_1cm: data.hourly.soil_moisture_0_1cm,
            wind_speed_10m: data.hourly.wind_speed_10m,
            uv_index: data.hourly.uv_index,
            dewpoint_2m: data.hourly.dewpoint_2m
        };

        // Parse daily data
        const daily = {
            time: data.daily.time.map(t => new Date(t)),
            temperature_2m_max: data.daily.temperature_2m_max,
            temperature_2m_min: data.daily.temperature_2m_min,
        };

        return { hourly, daily };

    } catch (err) {
        console.error("Error fetching Open-Meteo data:", err);
        return null;
    }
}


  function updateWeatherUI(weatherData) {
    console.log("updateWeatherUI called with:", weatherData);
    
    if (!weatherData || !weatherData.hourly || !weatherData.daily) {
      console.error("Invalid weather data structure:", weatherData);
      return;
    }

    const { hourly, daily } = weatherData;
    console.log("Processing hourly data:", hourly);
    console.log("Processing daily data:", daily);
    
    // Update current weather summary
    const currentTemp = hourly.temperature_2m[0];
    const feelsLike = hourly.apparent_temperature[0];
    const currentHumidity = hourly.humidity_2m[0];
    const currentWindSpeed = hourly.wind_speed_10m[0];
    const currentUV = hourly.uv_index[0];
    const currentSoilMoisture = hourly.soil_moisture_0_1cm[0];
    const currentDewpoint = hourly.dewpoint_2m[0];
    
    // Update main temperature and feels like
    const tempElement = document.querySelector('.temp-txt');
    if (tempElement) tempElement.textContent = `${Math.round(currentTemp)} °C`;
    
    // Add feels like below temperature
    const feelsLikeElement = document.querySelector('.feels-like-txt') || createFeelsLikeElement();
    if (feelsLikeElement) feelsLikeElement.textContent = `Feels like ${Math.round(feelsLike)} °C`;
    
    // Update precipitation
    const currentPrecipitation = hourly.precipitation[0];
    const precipitationElement = document.querySelector('.precipitation-value-txt');
    if (precipitationElement) precipitationElement.textContent = `${Math.round(currentPrecipitation)}mm`;
    
    // Update summary weather info with today's min/max
    const todayMaxTemp = daily.temperature_2m_max[0];
    const todayMinTemp = daily.temperature_2m_min[0];
    const currentMaxElement = document.querySelector('.current-max-temp');
    const currentMinElement = document.querySelector('.current-min-temp');
    if (currentMaxElement) currentMaxElement.textContent = Math.round(todayMaxTemp);
    if (currentMinElement) currentMinElement.textContent = Math.round(todayMinTemp);
    
    // Update weather conditions
    const humidityElement = document.querySelector('.humidity-value-txt');
    const windElement = document.querySelector('.wind-value-txt');
    const dewpointElement = document.querySelector('.dewpoint-value-txt');
    const uvElement = document.querySelector('.uv-value-txt');
    const soilMoistureElement = document.querySelector('.soil-moisture-value-txt');
    
    if (humidityElement) humidityElement.textContent = `${Math.round(currentHumidity)}%`;
    if (windElement) windElement.textContent = `${Math.round(currentWindSpeed)} km/h`;
    if (dewpointElement) dewpointElement.textContent = `${Math.round(currentDewpoint)}°`;
    if (uvElement) uvElement.textContent = Math.round(currentUV);
    if (soilMoistureElement) soilMoistureElement.textContent = `${Math.round(currentSoilMoisture)}%`;
    
    // Update today's hourly forecast
    updateTodayForecast(hourly);
    
    // Update weekly forecast
    updateWeeklyForecast(daily);
    
    // Update current date
    updateCurrentDate();
  }

  function updateTodayForecast(hourly) {
    if (!hourly || !hourly.time || !hourly.temperature_2m || !hourly.precipitation) {
      console.error("Invalid hourly data structure:", hourly);
      return;
    }
    
    const container = document.querySelector('.forecast-item-container');

      return;

    container.innerHTML = '';
    
    // Show forecast for next 8 hours (every 3 hours)
    const timeSlots = [0, 3, 6, 9, 12, 15, 18, 21];
    
    timeSlots.forEach(hour => {
      if (hour < hourly.time.length) {
        const time = new Date(hourly.time[hour]);
        const temp = hourly.temperature_2m[hour];
        const precipitation = hourly.precipitation[hour];
        
        const forecastItem = document.createElement('div');
        forecastItem.className = 'forecast-item';
        
        const timeStr = time.toLocaleTimeString('en-US', {

            <small style="color: #888; font-size: 10px;">${Math.round(temp)}°C</small>

        `;
        
        container.appendChild(forecastItem);
      }
    });
  }

async function addFarmMap(farm, structures){
  const shape = typeof farm.shape_geojson === "string" 
  ? JSON.parse(farm.shape_geojson) 
  : farm.shape_geojson;
  // farm polygon reversed
  const farmCoords = shape.coordinates[0].map(coord => [coord[1], coord[0]]);
    // compute farm centroid
    const latSum = farmCoords.reduce((sum, coord) => sum + coord[0], 0);
  const lngSum = farmCoords.reduce((sum, coord) => sum + coord[1], 0);
  const center = [latSum / farmCoords.length, lngSum / farmCoords.length];

  const map = L.map('map').setView(center, 17);

  L.tileLayer('https://api.maptiler.com/tiles/satellite-v2/{z}/{x}/{y}.jpg?key=1t5oDUJ2R2L0CtfceejE', {
    maxZoom: 19,
    attribution: '&copy; OpenStreetMap contributors'
  }).addTo(map);
  //drawing
  const farmLayer = L.polygon(farmCoords, {
    color: "green",
    fillColor: "#4CAF50",
    fillOpacity: 0.5
  }).addTo(map);

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Farm Details</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />
  <!-- <script src="https://cdn.tailwindcss.com"></script> -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css" />

  <link rel="stylesheet" href="css/farmerDashboard.css" />
  <link rel="stylesheet" href="css/growLocations.css" />
 
</head>

  <body>

<div class="sidebar-container"></div>

<div class="header" style="z-index: 2;">
    <div class="search-box">
      <i class="fa fa-search"></i>
      <input type="text" placeholder="Search crops, plants, farm" />
    </div>
    <div class="lang-toggle" id="lang-toggle">
      <span class="lang active" id="en">EN</span>
      <span class="lang" id="ar">ع</span>
    </div>
    <i class="help-btn fa-solid fa-circle-info" id="help"></i>
    <i class="fa-solid fa-moon" style="margin-left: 26px; font-size: 20px;   transition: all 0.5s;" id="icon"></i>
    <i class="fa-solid fa-bell" id="alert"></i>
</div>
<div class="body-container" style="margin-inline-start: 100px; padding-top: 76px;">
<div class="growLocations-container" >
  <h2 style="letter-spacing: 2px; margin-bottom: 35px; ">GROW LOCATIONS</h2>

  <div class="inputcontainer" style="display: flex;">
  <div class="input-group2"  >
    <i class="fa-solid fa-magnifying-glass"></i>
    <input type="search" placeholder="Search Locations...">
  </div>
    <button class="locationBtn" >New Grow Location</button>
</div>
  <main class="table" id="workers_table"> 
    <section class="table-body">
      <table>
        <thead>
          <tr>
            <!-- <th> ID <span class="icon-arrow">&UpArrow;</span></th> -->
            <th> Name <span class="icon-arrow">&UpArrow;</span></th>
            <th> Structure Type </th>
            <th> Crops </th>
            <th> Size (in hectares )</th>
            <th> Planting Format </th>
            <th></th>
        </tr>
        </thead>
        <tbody>
            <tr>
              <!-- <td> T0001 </td> -->
              <td> Net House 2 </td>
              <td> 
                <p class="structureType field">Field</p> 
            </td>
            <td>  </td>
            <td>  5.4 hectares</td>

              <td> Planted in Beds </td>
              <td class="action-buttons">
                <button class="view-btn"><i class="fa-solid fa-eye"></i></button>
                <button class="edit-btn"><i class="fa-solid fa-pen"></i></button>
                <button class="delete-btn"><i class="fa-solid fa-trash"></i></button>
              </td>
          </tr>
        </tbody>

      </table>
    </section>
  </main>
</div>

<div class="newGrowLocationContainer" >
    <div class="btn-group">
        <button >New Planting</button>
        <button id="addBeds">Add Beds</button>
    </div>
    <div id="overview" class="section active" style="flex: 1;">
        <!-- <img src="media\farm.png" class="farm-img"> -->
        <h2 style="font-size: 18px; margin-bottom: 5px;">Farm Overview</h2>
        <p>Location: Al Ain, UAE</p>
        <p>Status: Healthy </p>
        <p>GPS Coordinates</p>
        <p>Size</p>
        <p>Created</p>
        <!-- <p>Soil Moisture: 45%</p>
        <p>Temperature: 28°C</p> -->
      </div>
      <div >

      <div >
        <h3 style="margin-top: 20px;">MAP VIEW</h3>
        <div id="map"></div>
      </div>
      </div>
</div>

<!-- Modal for Add Beds -->
<div id="addBedsModal" class="modal-overlay" style="display:none;">
    <div class="modal-content">
      <span class="close-modal" id="closeAddBedsModal">&times;</span>
      <h2>Add Beds</h2>
      <form id="addBedsForm">
        <label for="numBeds">Number of Beds:</label>
        <input type="number" id="numBeds" name="numBeds" min="1" required><br><br>
        <label for="plantingLength">Planting Length (m):</label>
        <input type="number" id="plantingLength" name="plantingLength" min="1" required><br><br>
        <label for="plantingWidth">Planting Width (m):</label>
        <input type="number" id="plantingWidth" name="plantingWidth" min="1" required><br><br>
        <button type="submit">Add</button>
      </form>
    </div>
  </div>
</div>
  <script src="js/farmerDashboard.js"></script>
  <script src="js/importHeaderBar.js"></script>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="https://cdn.jsdelivr.net/npm/leaflet-draw@1.0.4/dist/leaflet.draw.js"></script>
<script src="https://unpkg.com/leaflet-control-geocoder/dist/Control.Geocoder.js"></script>
<script src="https://cdn.osmbuildings.org/classic/0.2.2b/OSMBuildings-Leaflet.js"></script>
  <script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>
  </body>
<script>
    const map = L.map('map').setView([24.2262, 55.7448], 15);
    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
      attribution: '© OpenStreetMap contributors'
    }).addTo(map);
    L.polygon([
      [24.2262, 55.7448],
      [24.228, 55.748],
      [24.224, 55.749]
    ], {
      color: 'green',
      fillColor: '#4CAF50',
      fillOpacity: 0.5
    }).addTo(map).bindPopup("Al Ain Farm");

    const locationBtn = document.querySelector('.locationBtn');
    const newGrowLocationContainer = document.querySelector('.newGrowLocationContainer');
    const growLocationsMain = document.querySelector('.growLocations-container');

    // locationBtn.addEventListener('click', function(){
    //     newGrowLocationContainer.style.display = 'block';
    //     growLocationsMain.style.display = 'none';

    // });

    const addBedsBtn = document.getElementById('addBeds');
const addBedsModal = document.getElementById('addBedsModal');
const closeAddBedsModal = document.getElementById('closeAddBedsModal');

addBedsBtn.addEventListener('click', function() {
  addBedsModal.style.display = 'flex';
});

closeAddBedsModal.addEventListener('click', function() {
  addBedsModal.style.display = 'none';
});

// Optional: Close modal when clicking outside the modal content
addBedsModal.addEventListener('click', function(e) {
  if (e.target === addBedsModal) {
    addBedsModal.style.display = 'none';
  }
});
</script>

</html>

function renderInvitations(rows) {
  const tbody = document.getElementById('invites-tbody');
  tbody.innerHTML = "";

  if (!rows.length) {
    const tr = document.createElement('tr');
    tr.innerHTML = `<td colspan="7" style="text-align:center; opacity:.7;">No invitations yet</td>`;
    tbody.appendChild(tr);
    return;
  }

  for (const row of rows) {
    const tr = document.createElement('tr');

    const name = row.invitee_name ?? "—";
    const role = row.user_role ?? "—";
    const perms = row.permissions;
    const farms = formatFarms(row.technician_assignments);
    const expiry = formatDate(row.expiry_date);
    const status = row.status ?? "—";

    tr.innerHTML = `
      <td>${name}</td>
      <td>${role}</td>
      <td>${perms}</td>
      <td>${farms}</td>
      <td>${expiry}</td>
      <td>${status}</td>
     
    `;
     // <td class="actions">
      //   <button class="edit-btn" data-id="${row.invitation_id}">Edit</button>
      //   <button class="revoke-btn" data-id="${row.invitation_id}">Revoke</button>
      // </td>
    tbody.appendChild(tr);
  }
  wireRowActions();
}

function formatPermissions(perms) {
  if (!perms) return "-";
  return Array.isArray(perms) ? perms.join(", ") : String(perms);
}

function formatFarms(assignments) {
  if (!assignments?.length) return "-";
  return assignments.map(a => {
    const farmName = a?.farm?.Farm_name ?? a?.farm?.farm_name ?? "Unknown Farm";
    const structName = a?.structure?.structure_name ?? "Unknown Structure";
    return `- ${farmName}, ${structName}`;
  }).join("<br>");
}

function formatDate(d) {
  if (!d) return "-";
  const date = new Date(d);
  return date.toLocaleDateString(undefined, { year: 'numeric', month: 'short', day: '2-digit' });
}

async function handleRevoke(invitation_id) {
  const { error } = await supa
    .from('invitations')
    .update({ status: 'revoked' })
    .eq('invitation_id', invitation_id);
  if (error) return console.error("Revoke failed:", error);
  // await loadInvites();
}
 
function wireRowActions() {
  document.querySelectorAll('.revoke-btn').forEach(btn => {
    btn.addEventListener('click', () => handleRevoke(btn.dataset.id));
  });
  document.querySelectorAll('.edit-btn').forEach(btn => {
    btn.addEventListener('click', () => openEditDialog(btn.dataset.id));
  });
}

async function addFarmSelector(){
  const container = document.getElementById("farmStructureContainer");
  const wrapper = document.createElement("div");
  wrapper.classList.add("selectors");
  wrapper.style.marginBottom = "1px";

  const farmDropdown = document.createElement("select");
  farmDropdown.innerHTML = `<option value="">Select Farm</option>`;

  const { data: { user }, error: authError } = await supa.auth.getUser();
  userId = user.id;
  const { data: farms} = await supa
    .from("Farms")
    .select(`*`)
    .eq("User_id", userId);
    // console.log(userId);
    farms.forEach(farm => {
      const opt = document.createElement("option");
      opt.value = farm.farm_id;
      opt.textContent = farm.Farm_name;
      farmDropdown.appendChild(opt);
    });

    const structureDropdown = document.createElement("select");
    structureDropdown.innerHTML = `<option value="">Select Structure</option>`;
    structureDropdown.disabled = true;
    farmDropdown.addEventListener("change", async (e) => {
    const farmId = e.target.value;
    structureDropdown.innerHTML = `<option value="">Select Structure</option>`;
    structureDropdown.disabled = true;

    if (!farmId) return;
    const { data: structures } = await supa
      .from("FarmStructures")
      .select("structure_id, structure_name")
      .eq("farm_id", farmId);

    structures.forEach(s => {
      const opt = document.createElement("option");
      opt.value = s.structure_id;
      opt.textContent = s.structure_name;
      structureDropdown.appendChild(opt);
    });

    structureDropdown.disabled = false;
  });

  // append dropdowns to wrapper
  wrapper.appendChild(farmDropdown);
  wrapper.appendChild(structureDropdown);

  container.appendChild(wrapper);
}

function generateCode(length = 6) {
  const chars = "ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789";
  let code = "";
  for (let i = 0; i < length; i++) {
    const randomIndex = Math.floor(Math.random() * chars.length);
    code += chars[randomIndex];
  }
  return code;
}
